name: DB 마이그레이션

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install psycopg2-binary
      - name: 마이그레이션 실행
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -u db_migrate.py
